# Assessly — nginx reverse proxy for the Next.js app on 127.0.0.1:3000.
# Installed by deploy/setup-server.sh to /etc/nginx/sites-available/assessly.
# After DNS points here, run certbot --nginx to add TLS (it rewrites this file).

server {
    listen 80;
    server_name _;   # replace with your domain before running certbot

    # Document uploads go up to 20 MB in the app; leave headroom.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # CRITICAL for this app: generation progress streams over SSE for many
        # minutes. Buffering breaks the live timeline; short timeouts kill runs.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
